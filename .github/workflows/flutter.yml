name: Build Flutter App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK and Catch Real Error
        run: |
          flutter build apk --release --verbose > build_log.txt 2>&1 || true
          echo "==================== ASLI ERROR YAHAN HAI ===================="
          grep -iE "error:|failure:|what went wrong" build_log.txt -A 3 -B 1 || true
          echo "=============================================================="
          exit 1
