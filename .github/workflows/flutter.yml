name: Auto-Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Auto-Generate Fresh Android/iOS Structure
        run: |
          echo "Purging old/broken Android and iOS folders..."
          rm -rf android ios
          
          echo "Creating a fresh temporary Flutter structure..."
          flutter create . --org com.tarun.app --project-name temp_app --platforms=android
          
          echo "Fresh Android project generated successfully by GitHub Actions!"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
