name: Auto-Fix and Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Auto-Configure Project Name and Structure
        run: |
          # pubspec.yaml से अपने आप प्रोजेक्ट का नाम निकाल लेगा
          PROJECT_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          echo "Detected project name: $PROJECT_NAME"
          
          # पुरानी टूटी फाइलें हटाकर उसी सही नाम से फ्रेश सेटअप बना देगा
          rm -rf android ios
          flutter create . --project-name $PROJECT_NAME --platforms=android
          
          echo "Android structure successfully auto-generated for $PROJECT_NAME!"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
