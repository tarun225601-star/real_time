import 'package:flutter/material.dart';
import 'package:firebase_core/firebase_core.dart';
import 'package:provider/provider.dart';
import 'services/firestore_service.dart';
import 'models/shop_state.dart';
import 'screens/customer_home.dart';
import 'screens/shop_admin.dart';

void main() async {
  WidgetsFlutterBinding.ensureInitialized();
  await Firebase.initializeApp();
  runApp(const MarketplaceApp());
}

class MarketplaceApp extends StatelessWidget {
  const MarketplaceApp({Key? key}) : super(key: key);

  @override
  Widget build(BuildContext context) {
    return MultiProvider(
      providers: [
        Provider<FirestoreService>(create: (_) => FirestoreService()),
        StreamProvider<ShopState?>(
          create: (context) =>
              context.read<FirestoreService>().shopStateStream(),
          initialData: null,
        ),
      ],
      child: MaterialApp(
        title: 'Marketplace',
        theme: ThemeData(primarySwatch: Colors.indigo),
        home: const RoleSwitcher(),
        debugShowCheckedModeBanner: false,
      ),
    );
  }
}

/// Simple role switcher â in production replace with proper auth.
class RoleSwitcher extends StatefulWidget {
  const RoleSwitcher({Key? key}) : super(key: key);
  @override
  State<RoleSwitcher> createState() => _RoleSwitcherState();
}

class _RoleSwitcherState extends State<RoleSwitcher> {
  bool _isAdmin = false;
  final TextEditingController _codeCtrl = TextEditingController();

  void _toggleRole() {
    if (_isAdmin) {
      setState(() => _isAdmin = false);
    } else {
      // Very simple âadmin codeâ â replace with Firebase Auth in real app
      if (_codeCtrl.text.trim() == 'admin123') {
        setState(() => _isAdmin = true);
      } else {
        ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(content: Text('Invalid admin code')),
        );
      }
    }
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: Text(_isAdmin ? 'Shopkeeper Admin' : 'Marketplace'),
        actions: [
          IconButton(
            icon: Icon(_isAdmin ? Icons.person : Icons.admin_panel_settings),
            onPressed: _toggleRole,
          )
        ],
      ),
      body: _isAdmin ? const ShopAdminScreen() : const CustomerHomeScreen(),
    );
  }
}
