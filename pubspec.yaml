import 'package:flutter/material.dart';
import 'package:webview_flutter/webview_flutter.dart';
import 'package:http/http.dart' as http;
import 'package:shared_preferences/shared_preferences.dart';

void main() {
  runApp(const DarkStudioApp());
}

class DarkStudioApp extends StatelessWidget {
  const DarkStudioApp({Key? key}) : super(key: key);

  static const Color _primaryBackground = Color(0xFF0B132B);
  static const Color _accentCyan = Color(0xFF00F5D4);

  @override
  Widget build(BuildContext context) {
    final ThemeData base = ThemeData.dark();
    return MaterialApp(
      title: 'Dark Studio',
      debugShowCheckedModeBanner: false,
      theme: base.copyWith(
        scaffoldBackgroundColor: _primaryBackground,
        primaryColor: _accentCyan,
        colorScheme: base.colorScheme.copyWith(
          primary: _accentCyan,
          secondary: _accentCyan,
        ),
        appBarTheme: const AppBarTheme(
          backgroundColor: _primaryBackground,
          elevation: 0,
          titleTextStyle: TextStyle(
            color: Colors.white,
            fontSize: 20,
            fontWeight: FontWeight.bold,
          ),
          iconTheme: IconThemeData(color: Colors.white),
        ),
        cardColor: const Color(0xFF1C2541),
        textTheme: base.textTheme.apply(
          bodyColor: Colors.white70,
          displayColor: Colors.white,
        ),
        elevatedButtonTheme: ElevatedButtonThemeData(
          style: ElevatedButton.styleFrom(
            primary: _accentCyan,
            onPrimary: Colors.black,
            shape: RoundedRectangleBorder(
              borderRadius: BorderRadius.circular(8),
            ),
          ),
        ),
      ),
      home: const HomeScreen(),
    );
  }
}

class HomeScreen extends StatefulWidget {
  const HomeScreen({Key? key}) : super(key: key);
  @override
  State<HomeScreen> createState() => _HomeScreenState();
}

class _HomeScreenState extends State<HomeScreen> {
  final List<_WebItem> _items = [
    _WebItem(title: 'Flutter', url: 'https://flutter.dev'),
    _WebItem(title: 'Dart', url: 'https://dart.dev'),
    _WebItem(title: 'GitHub', url: 'https://github.com'),
  ];

  @override
  void initState() {
    super.initState();
    _loadLastVisited();
  }

  Future<void> _loadLastVisited() async {
    final prefs = await SharedPreferences.getInstance();
    final lastUrl = prefs.getString('last_visited_url');
    if (lastUrl != null) {
      // Show a snackbar with quick access
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(
          content: Text('Last visited: $lastUrl'),
          action: SnackBarAction(
            label: 'Open',
            onPressed: () => _openWebView(lastUrl, 'Last Visited'),
          ),
        ),
      );
    }
  }

  void _openWebView(String url, String title) async {
    final prefs = await SharedPreferences.getInstance();
    await prefs.setString('last_visited_url', url);
    if (!mounted) return;
    Navigator.of(context).push(
      MaterialPageRoute(
        builder: (_) => WebViewScreen(url: url, title: title),
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('Dark Studio'),
        centerTitle: true,
      ),
      body: ListView.builder(
        padding: const EdgeInsets.all(12),
        itemCount: _items.length,
        itemBuilder: (context, index) {
          final item = _items[index];
          return Card(
            margin: const EdgeInsets.symmetric(vertical: 8),
            shape: RoundedRectangleBorder(
              borderRadius: BorderRadius.circular(12),
            ),
            child: ListTile(
              title: Text(item.title,
                  style: const TextStyle(
                    fontWeight: FontWeight.bold,
                    color: Colors.white,
                  )),
              subtitle: Text(item.url,
                  style: const TextStyle(color: Colors.white70)),
              trailing: const Icon(Icons.open_in_browser, color: Colors.white70),
              onTap: () => _openWebView(item.url, item.title),
            ),
          );
        },
      ),
    );
  }
}

class WebViewScreen extends StatefulWidget {
  final String url;
  final String title;
  const WebViewScreen({Key? key, required this.url, required this.title})
      : super(key: key);
  @override
  State<WebViewScreen> createState() => _WebViewScreenState();
}

class _WebViewScreenState extends State<WebViewScreen> {
  bool _isLoading = true;
  late final WebViewController _controller;

  @override
  void initState() {
    super.initState();
    _controller = WebViewController()
      ..setJavaScriptMode(JavaScriptMode.unrestricted)
      ..setBackgroundColor(const Color(0x00000000))
      ..setNavigationDelegate(
        NavigationDelegate(
          onPageFinished: (_) {
            setState(() => _isLoading = false);
          },
          onWebResourceError: (error) {
            // Simple error handling
            ScaffoldMessenger.of(context).showSnackBar(
              SnackBar(content: Text('Error: ${error.description}')),
            );
          },
        ),
      )
      ..loadRequest(Uri.parse(widget.url));
  }

  Future<void> _refreshPage() async {
    setState(() => _isLoading = true);
    await _controller.reload();
  }

  @override
  Widget build(BuildContext context) {
    final accent = Theme.of(context).colorScheme.secondary;
    return Scaffold(
      appBar: AppBar(
        title: Text(widget.title),
        actions: [
          IconButton(
            icon: const Icon(Icons.refresh),
            onPressed: _refreshPage,
          ),
        ],
      ),
      body: Stack(
        children: [
          WebViewWidget(controller: _controller),
          if (_isLoading)
            const Center(
              child: CircularProgressIndicator(
                color: Color(0xFF00F5D4),
              ),
            ),
        ],
      ),
      floatingActionButton: FloatingActionButton(
        backgroundColor: accent,
        child: const Icon(Icons.open_in_new),
        onPressed: () async {
          // Example of using http to fetch page title (optional)
          final response = await http.get(Uri.parse(widget.url));
          if (response.statusCode == 200) {
            ScaffoldMessenger.of(context).showSnackBar(
              SnackBar(content: Text('Fetched ${response.body.length} bytes')),
            );
          }
        },
      ),
    );
  }
}

class _WebItem {
  final String title;
  final String url;
  const _WebItem({required this.title, required this.url});
}