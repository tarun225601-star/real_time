import 'package:flutter/material.dart';
import 'package:provider/provider.dart';
import '../services/firestore_service.dart';
import '../models/product.dart';
import '../models/shop_state.dart';
import '../widgets/product_tile.dart';

class ShopAdminScreen extends StatefulWidget {
  const ShopAdminScreen({Key? key}) : super(key: key);
  @override
  State<ShopAdminScreen> createState() => _ShopAdminScreenState();
}

class _ShopAdminScreenState extends State<ShopAdminScreen> {
  final _formKey = GlobalKey<FormState>();
  final _nameCtrl = TextEditingController();
  final _descCtrl = TextEditingController();
  final _priceCtrl = TextEditingController();
  final _imageCtrl = TextEditingController();

  Future<void> _addProduct() async {
    if (!_formKey.currentState!.validate()) return;
    final product = Product(
      id: '',
      name: _nameCtrl.text.trim(),
      description: _descCtrl.text.trim(),
      price: double.parse(_priceCtrl.text.trim()),
      imageUrl: _imageCtrl.text.trim(),
      outOfStock: false,
    );
    await context.read<FirestoreService>().addProduct(product);
    _formKey.currentState!.reset();
  }

  @override
  Widget build(BuildContext context) {
    final firestore = context.read<FirestoreService>();
    final shopState = context.watch<ShopState?>();

    return Scaffold(
      appBar: AppBar(
        title: const Text('Shop Admin Panel'),
        actions: [
          if (shopState != null)
            Row(
              children: [
                const Text('OPEN'),
                Switch(
                  value: shopState.isOpen,
                  onChanged: (val) => firestore.setShopOpen(val),
                ),
                const Text('CLOSED'),
                const SizedBox(width: 12),
              ],
            ),
        ],
      ),
      body: shopState == null
          ? const Center(child: CircularProgressIndicator())
          : SingleChildScrollView(
              padding: const EdgeInsets.all(12),
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  const Text('Add New Product', style: TextStyle(fontSize: 18)),
                  const SizedBox(height: 8),
                  Form(
                    key: _formKey,
                    child: Column(
                      children: [
                        TextFormField(
                          controller: _nameCtrl,
                          decoration: const InputDecoration(labelText: 'Name'),
                          validator: (v) => v == null || v.isEmpty ? 'Required' : null,
                        ),
                        TextFormField(
                          controller: _descCtrl,
                          decoration: const InputDecoration(labelText: 'Description'),
                          validator: (v) => v == null || v.isEmpty ? 'Required' : null,
                        ),
                        TextFormField(
                          controller: _priceCtrl,
                          decoration: const InputDecoration(labelText: 'Price'),
                          keyboardType: TextInputType.number,
                          validator: (v) => v == null || double.tryParse(v) == null
                              ? 'Enter valid price'
                              : null,
                        ),
                        TextFormField(
                          controller: _imageCtrl,
                          decoration: const InputDecoration(labelText: 'Image URL'),
                          validator: (v) => v == null || v.isEmpty ? 'Required' : null,
                        ),
                        const SizedBox(height: 12),
                        ElevatedButton(
                          onPressed: _addProduct,
                          child: const Text('Add Product'),
                        ),
                      ],
                    ),
                  ),
                  const Divider(height: 32),
                  const Text('Product List', style: TextStyle(fontSize: 18)),
                  const SizedBox(height: 8),
                  StreamBuilder<List<Product>>(
                    stream: firestore.productStream(),
                    builder: (context, snapshot) {
                      if (snapshot.hasError) {
                        return const Text('Error loading products');
                      }
                      if (!snapshot.hasData) {
                        return const Center(child: CircularProgressIndicator());
                      }
                      final products = snapshot.data!;
                      if (products.isEmpty) {
                        return const Text('No products yet');
                      }
                      return ListView.builder(
                        shrinkWrap: true,
                        physics: const NeverScrollableScrollPhysics(),
                        itemCount: products.length,
                        itemBuilder: (_, i) => AdminProductTile(product: products[i]),
                      );
                    },
                  ),
                ],
              ),
            ),
    );
  }
}

class AdminProductTile extends StatelessWidget {
  final Product product;
  const AdminProductTile({Key? key, required this.product}) : super(key: key);

  @override
  Widget build(BuildContext context) {
    final firestore = context.read<FirestoreService>();
    return Card(
      margin: const EdgeInsets.symmetric(vertical: 6),
      child: ListTile(
        leading: Image.network(product.imageUrl, width: 60, height: 60, fit: BoxFit.cover),
        title: Text(product.name),
        subtitle: Text('â¹${product.price.toStringAsFixed(0)}'),
        trailing: Row(
          mainAxisSize: MainAxisSize.min,
          children: [
            Switch(
              value: !product.outOfStock,
              onChanged: (val) => firestore.toggleOutOfStock(product.id, !val),
              activeColor: Colors.green,
              inactiveThumbColor: Colors.grey,
            ),
            IconButton(
              icon: const Icon(Icons.delete, color: Colors.red),
              onPressed: () => firestore.deleteProduct(product.id),
            ),
          ],
        ),
      ),
    );
  }
}
