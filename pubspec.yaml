import 'package:flutter/material.dart';
import 'package:provider/provider.dart';
import '../services/firestore_service.dart';
import '../models/product.dart';
import '../models/shop_state.dart';
import '../widgets/product_tile.dart';
import 'package:url_launcher/url_launcher.dart';
import 'package:intl/intl.dart';

class CustomerHomeScreen extends StatelessWidget {
  const CustomerHomeScreen({Key? key}) : super(key: key);

  String _formatCurrency(double amount) =>
      NumberFormat.currency(symbol: 'â¹', decimalDigits: 0).format(amount);

  Future<void> _launchWhatsApp(BuildContext context, List<Product> cart) async {
    if (cart.isEmpty) return;
    double total = cart.fold(0, (sum, p) => sum + p.price);
    String items = cart
        .map((p) => '- ${p.name} (â¹${_formatCurrency(p.price)})')
        .join('\n');
    final message = Uri.encodeComponent(
        'New Order:\n$items\n\nTotal: ${_formatCurrency(total)}');
    final url = 'https://wa.me/<SHOP_WHATSAPP_NUMBER>?text=$message';
    if (await canLaunchUrl(Uri.parse(url))) {
      await launchUrl(Uri.parse(url));
    } else {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text('Could not open WhatsApp')),
      );
    }
  }

  @override
  Widget build(BuildContext context) {
    final firestore = context.read<FirestoreService>();
    final shopState = context.watch<ShopState?>();

    return Scaffold(
      appBar: AppBar(
        title: const Text('Products'),
        actions: [
          IconButton(
            icon: const Icon(Icons.shopping_cart),
            onPressed: () async {
              // In a real app, maintain a proper cart state.
              // Here we just fetch all available items as a demo.
              final products = await firestore.productStream().first;
              final available = products.where((p) => !p.outOfStock).toList();
              await _launchWhatsApp(context, available);
            },
          )
        ],
      ),
      body: shopState == null
          ? const Center(child: CircularProgressIndicator())
          : Column(
              children: [
                if (!shopState.isOpen)
                  Container(
                    width: double.infinity,
                    color: Colors.redAccent,
                    padding: const EdgeInsets.all(8),
                    child: const Text(
                      'Shop is currently CLOSED',
                      style: TextStyle(color: Colors.white),
                      textAlign: TextAlign.center,
                    ),
                  ),
                Expanded(
                  child: StreamBuilder<List<Product>>(
                    stream: firestore.productStream(),
                    builder: (context, snapshot) {
                      if (snapshot.hasError) {
                        return const Center(child: Text('Error loading products'));
                      }
                      if (!snapshot.hasData) {
                        return const Center(child: CircularProgressIndicator());
                      }
                      final products = snapshot.data!;
                      if (products.isEmpty) {
                        return const Center(child: Text('No products found'));
                      }
                      return ListView.builder(
                        itemCount: products.length,
                        itemBuilder: (_, index) => ProductTile(product: products[index]),
                      );
                    },
                  ),
                ),
              ],
            ),
    );
  }
}
