import 'package:cloud_firestore/cloud_firestore.dart';
import '../models/product.dart';
import '../models/shop_state.dart';

class FirestoreService {
  final FirebaseFirestore _db = FirebaseFirestore.instance;

  // ------------------- Products -------------------
  Stream<List<Product>> productStream() {
    return _db.collection('products').snapshots().map((snapshot) =>
        snapshot.docs.map((doc) => Product.fromDoc(doc)).toList());
  }

  Future<void> addProduct(Product product) async {
    await _db.collection('products').add(product.toMap());
  }

  Future<void> deleteProduct(String id) async {
    await _db.collection('products').doc(id).delete();
  }

  Future<void> toggleOutOfStock(String id, bool outOfStock) async {
    await _db.collection('products').doc(id).update({'outOfStock': outOfStock});
  }

  // ------------------- Shop State -------------------
  Stream<ShopState?> shopStateStream() {
    return _db
        .collection('meta')
        .doc('shop')
        .snapshots()
        .map((doc) => doc.exists ? ShopState.fromMap(doc.data()!) : null);
  }

  Future<void> setShopOpen(bool isOpen) async {
    await _db.collection('meta').doc('shop').set({'isOpen': isOpen});
  }
}
