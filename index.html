<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Speech Bridge - Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            color: #00ffcc;
            margin-bottom: 10px;
        }
        p {
            color: #b0b0b0;
            font-size: 14px;
        }
        button {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: 0.3s;
        }
        button:hover {
            background-color: #00b386;
        }
        button.recording {
            background-color: #ff4d4d;
            color: white;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Speech Bridge Test</h2>
        <p>मोबाइल पर माइक टेस्ट करने और लाइव इंटरैक्शन देखने के लिए बटन दबाएं:</p>
        
        <button id="micBtn" onclick="toggleRecord()">🎙️ रिकॉर्ड करना शुरू करें</button>
        <div id="status">स्थिति: तैयार (Ready)</div>
    </div>

    <script>
        let isRecording = false;

        function toggleRecord() {
            const btn = document.getElementById('micBtn');
            const status = document.getElementById('status');

            if (!isRecording) {
                // माइक की परमिशन मांग रहा है
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(stream => {
                        isRecording = true;
                        btn.innerText = "🛑 बंद करें (Recording...)";
                        btn.classList.add('recording');
                        status.innerText = "स्थिति: आवाज़ रिकॉर्ड हो रही है...";
                    })
                    .catch(err => {
                        alert("माइक की परमिशन नहीं मिली भाई: " + err);
                        status.innerText = "स्थिति: परमिशन एरर!";
                    });
            } else {
                isRecording = false;
                btn.innerText = "🎙️ रिकॉर्ड करना शुरू करें";
                btn.classList.remove('recording');
                status.innerText = "स्थिति: रिकॉर्डिंग रुक गई।";
            }
        }
    </script>

</body>
</html>
